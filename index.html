    .container {
        /* background-color: #f5f5f5; */
        margin: auto;

    .photoholder {

    }

    .profile {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 5px solid white;
        display: block;
        position: absolute;
        top: 200px;
        left: 20px;
        background-color: white;
        z-index: 1;
        box-shadow: 0 0 1em #333;
        overflow: hidden;
    }

    .profile img {

        height: 100%;

    .card {

    }

    .svgscale {
        width: 40px;
        height: auto;
        filter: drop-shadow(0 0 2em #333);
    }

    .btn-info {
        padding: 10px;
        background: #002d5e;
        width: max-content;
        border-radius: 1em;
        text-decoration: none;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        margin-top: 10px;
    }

    .info-btn {
        display: flex;

        gap: 10px;
    }

    .link-bar {
        display: flex;
        flex-direction: column;
        align-self: center;
        justify-content: center;
        gap: 10px;
        margin-top: 70px;

    .link-bar a {

        background-color: #002d5e;

        text-align: center;
        color: #f5f5f5;
        align-self: center;
